name: Tests

on:
  push:
    branches:
      - main
      - "codex/**"
      - "phase-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall calcore calibrator server.py cli.py

      - name: Run test suite
        run: pytest

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            coverage.lcov
          retention-days: 14

  # ── Frontend lint + build ─────────────────────────────────────────────────
  frontend-checks:
    name: Frontend / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Playwright E2E ────────────────────────────────────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "22"

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security / bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF upload (requires GitHub Advanced Security on private repos)

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Run bandit
        # Fails the job on any HIGH severity finding. MEDIUM/LOW are informational.
        # SARIF output requires Advanced Security (private repo); plain text is used instead.
        run: |
          bandit -r calcore calibrator server.py cli.py \
            -c pyproject.toml \
            --severity-level high

  # ── Merge gate ────────────────────────────────────────────────────────────
  merge-gate:
    name: All checks passed
    needs: [backend-tests, frontend-checks, playwright-e2e, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
