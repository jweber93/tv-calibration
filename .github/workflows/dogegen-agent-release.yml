name: Dogegen Agent Release

# Builds tools/dogegen-agent/agent.py into a standalone Windows .exe
# (Python bundled in via PyInstaller — no separate Python install needed
# on the target PC) and publishes it as a GitHub Release asset.
#
# Triggers:
#   dogegen-agent-v* tag → release named after the tag
#   workflow_dispatch     → manual build; uploads to a draft release

on:
  push:
    tags: ["dogegen-agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: tools/dogegen-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        working-directory: tools/dogegen-agent
        run: |
          pyinstaller --onefile --name dogegen-agent `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.loops.auto `
            agent.py

      - name: Assemble release bundle
        working-directory: tools/dogegen-agent
        run: |
          New-Item -ItemType Directory -Path dist\bundle | Out-Null
          Copy-Item dist\dogegen-agent.exe dist\bundle\
          Copy-Item agent.example.json dist\bundle\
          Copy-Item README.md dist\bundle\
          Compress-Archive -Path dist\bundle\* -DestinationPath dogegen-agent-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogegen-agent-windows
          path: tools/dogegen-agent/dogegen-agent-windows.zip

      - name: Create/update release
        if: startsWith(github.ref, 'refs/tags/dogegen-agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/dogegen-agent/dogegen-agent-windows.zip
          draft: true
          generate_release_notes: true
