name: CI

# Stages: Lint → Test → Scan → (Build on main/tags)

on:
  push:
    branches: [main, "codex/**", "phase-*", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

# Cancel in-flight runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"
  NODE_DEFAULT: "22"

# ── Stage 1: Lint ─────────────────────────────────────────────────────────────
jobs:
  lint-python:
    name: Lint / ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check --output-format=github .

      # ruff format --check deferred: pre-existing codebase needs a dedicated
      # formatting pass before enforcement can be enabled here.

  lint-shell:
    name: Lint / shellcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (scripts/)
        if: ${{ hashFiles('scripts/**/*.sh') != '' }}
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          severity: warning

      - name: actionlint (workflow files)
        uses: rhysd/actionlint@v1.7.7

# ── Stage 2: Test ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-python]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # Empty values → all hardware calls are mocked in the test suite.
      DOGEGEN_PATH: ""
      ZRO_BRIDGE_URL: ""
      # Disable LLM calls during CI; tests that need LLM use monkeypatching.
      LLM_ENDPOINT: ""

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          extra-packages: ruff

      - name: Compile Python sources
        run: python -m compileall calcore calibrator server.py cli.py

      - name: Run test suite (hardware marker excluded)
        run: pytest -m "not hardware"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            coverage.lcov
          retention-days: 14

  golden-regression:
    name: Golden Dataset Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libcairo2 \
            fonts-liberation

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Run golden regression tests
        run: pytest tests/golden/ -v --tb=short -m "not hardware" --no-cov

      - name: Upload golden diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-regression-failures
          path: tests/golden/diffs/
          retention-days: 7

  report-layout-regression:
    name: Report Layout Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Generate sample calibration report artifacts
        run: python3 scripts/generate_sample_report_artifacts.py

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Diff report layout against committed baseline
        working-directory: frontend
        run: npm run test:report-visual

      - name: Upload report regression artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: report-layout-regression
          path: |
            test-artifacts/report-layout/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  frontend-checks:
    name: Frontend / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-python]
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-checks]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

# ── Stage 3: Security Scan ────────────────────────────────────────────────────
  security-bandit:
    name: Security / bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Run bandit (HIGH severity, fail on findings)
        run: |
          bandit -r calcore calibrator server.py cli.py \
            -c pyproject.toml \
            --severity-level high \
            --format json \
            --output bandit-report.json || true
          bandit -r calcore calibrator server.py cli.py \
            -c pyproject.toml \
            --severity-level high

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  # security-trivy is intentionally disabled: aquasecurity/trivy-action has had
  # broken internal sub-action pins on recent releases (0.28, v0.30). Re-enable
  # once a stable version is confirmed. Bandit covers security scanning for now.
  # security-trivy: ...

# ── Stage 4: Docker Build Smoke Test ──────────────────────────────────────────
  docker-build:
    name: Docker / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build calcore-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tv-calibration/calcore-server:ci-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs and responds
        run: |
          docker run --rm -d --name calcore-test \
            -p 8000:8000 \
            -e LITELLM_ENDPOINT= \
            -e LITELLM_MODEL= \
            -e ZRO_BRIDGE_URL= \
            -e DOGEGEN_PATH= \
            tv-calibration/calcore-server:ci-${{ github.run_id }}
          # Wait for the server to become healthy and verify frontend is served
          for _ in $(seq 1 30); do
            API_OK=false
            FRONTEND_OK=false
            if curl -sf http://localhost:8000/api/profiles > /dev/null 2>&1; then
              API_OK=true
            fi
            if curl -sf http://localhost:8000/ | grep -q '<!DOCTYPE\|<html'; then
              FRONTEND_OK=true
            fi
            if $API_OK && $FRONTEND_OK; then
              echo "Server is healthy (API + frontend verified)"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start or serve frontend within 60s"
          docker logs calcore-test
          exit 1

      - name: Stop and inspect container
        if: always()
        run: |
          docker stop calcore-test || true
          docker rm calcore-test || true

# ── Stage 5: Versioning ───────────────────────────────────────────────────────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-checks]
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha_short: ${{ steps.ver.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe

      - id: ver
        name: Derive version tag
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-${SHA_SHORT}")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${TAG}"

# ── Merge Gate ────────────────────────────────────────────────────────────────
  merge-gate:
    name: All checks passed
    needs:
      - lint-python
      - lint-shell
      - backend-tests
      - golden-regression
      - frontend-checks
      - playwright-e2e
      - security-bandit
      - docker-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed."
