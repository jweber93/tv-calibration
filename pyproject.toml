[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--cov=calcore",
    "--cov=calibrator",
    "--cov-report=xml:coverage.xml",
    "--cov-report=lcov:coverage.lcov",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "--junitxml=test-results.xml",
]
markers = [
    "hardware: tests requiring real hardware (ADB device, ZRO bridge, colorimeter)",
    "slow: tests taking >5 seconds",
    "integration: tests exercising multiple components together",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehension, SIM: simplify
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501 handled by the formatter (line-length above), not the linter
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# B101: assert statements are fine outside tests
# B607: partial executable path — adb/uvicorn must be on PATH, full path is impractical
skips = ["B101", "B607"]
exclude_dirs = ["tests", "tools"]
