[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--cov=calcore",
    "--cov=calibrator",
    "--cov-report=xml:coverage.xml",
    "--cov-report=lcov:coverage.lcov",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "--junitxml=test-results.xml",
]
markers = [
    "hardware: tests requiring real hardware (ADB device, ZRO bridge, colorimeter)",
    "slow: tests taking >5 seconds",
    "integration: tests exercising multiple components together",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Bug-catching rules only for the initial ruff adoption.
# I (isort) and UP (pyupgrade) are deferred: they require a mechanical
# modernisation pass across the pre-existing codebase (typing.List → list,
# Optional[X] → X | None, import sorting) that belongs in a dedicated PR.
select = ["E", "F", "W", "B", "C4", "SIM"]
# E501: line length enforced by the formatter, not the linter
# B008: function-call default arg (FastAPI Depends pattern)
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# B101: assert statements are fine outside tests
# B607: partial executable path — adb/uvicorn must be on PATH, full path is impractical
skips = ["B101", "B607"]
exclude_dirs = ["tests", "tools"]
