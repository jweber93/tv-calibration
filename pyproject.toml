[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--cov=calcore",
    "--cov=calibrator",
    "--cov-report=xml:coverage.xml",
    "--cov-report=lcov:coverage.lcov",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "--junitxml=test-results.xml",
]
markers = [
    "hardware: tests requiring real hardware (ADB device, ZRO bridge, colorimeter)",
    "slow: tests taking >5 seconds",
    "integration: tests exercising multiple components together",
    "flaky(reruns, reruns_delay): timing-sensitive tests that may fail intermittently in CI (file watcher debounce, polling)",
]

# Rerun tests marked with @pytest.mark.flaky up to 2 times with a 1s delay.
# Requires pytest-rerunfailures (see requirements.txt).
[tool.pytest_rerunfailures]
reruns = 2
reruns_delay = 1

[tool.coverage.run]
branch = true
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend/**", ".claude/**"]

[tool.ruff.lint]
# Initial ruff adoption: select bug-catching rules only.
# Deferred to a follow-up modernisation PR:
#   UP (pyupgrade) — typing.List→list, Optional[X]→X|None throughout codebase
#   I  (isort)     — import ordering throughout codebase
select = ["E", "F", "W", "B", "C4", "SIM"]
ignore = [
    # Style / formatter handles these
    "E501",   # line length — enforced by ruff format, not the linter
    "E402",   # module-level import not at top — server.py uses guarded imports
    "W291",   # trailing whitespace — pre-existing in test files
    "W292",   # no newline at end of file — pre-existing
    "W293",   # whitespace in blank line — pre-existing in test files
    # Pre-existing unused-import debt (widespread; clean up separately)
    "F401",
    "F811",   # redefinition of unused name
    "F841",   # local variable assigned but never used
    # Pre-existing simplification suggestions (style, not bugs)
    "SIM105", # use contextlib.suppress instead of try/except/pass
    "SIM108", # use ternary operator
    "SIM117", # merge nested with statements
    "B905",   # zip() without explicit strict= — Python 3.10+ feature, skip for 3.9 compat
    "SIM300", # Yoda conditions
    "C408",   # unnecessary dict() call
    "B007",   # unused loop control variable
    "B904",   # raise-without-from inside except — pre-existing in server.py
    # FastAPI / framework patterns
    "B008",   # function-call default arg (FastAPI Depends)
    # Pre-existing style in test files
    "E702",   # multiple statements on one line (semicolon)
    "F541",   # f-string without placeholders
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# B101: assert statements are fine outside tests
# B607: partial executable path — adb/uvicorn must be on PATH, full path is impractical
skips = ["B101", "B607"]
exclude_dirs = ["tests", "tools"]
